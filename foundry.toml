[profile.default]
src = "src"
out = "out"
test = 'tests'
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 1000
seed = "0x640"

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = true

[profile.pr.fuzz]
runs = 5000

[profile.pr.invariant]
runs = 512

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1024

[rpc_endpoints]
mainnet = "${RPC_MAINNET}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chainId = 1 }
